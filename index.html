<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CONAN FILES — Detective Conan Encyclopedia</title>
<style>
:root{--bg:#080b12;--card:#111827;--card2:#172033;--text:#f3f4f6;--muted:#9ca3af;--red:#e63946;--gold:#f4c95d;--line:#263247}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#070a10,#0d1320);color:var(--text);font-family:Arial,"Noto Sans Arabic",sans-serif}
a{text-decoration:none;color:inherit}.wrap{max-width:1150px;margin:auto;padding:18px}
header{padding:28px 0 20px;border-bottom:1px solid var(--line);margin-bottom:20px}
.logo{font-size:30px;font-weight:900;letter-spacing:1px}.logo span{color:var(--red)}
.sub{color:var(--muted);margin-top:6px}
.search{width:100%;padding:15px 17px;border-radius:14px;border:1px solid var(--line);background:#0d1421;color:white;font-size:16px;margin:20px 0}
.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#0e1624;color:#ddd;cursor:pointer}.filter.active{background:var(--red);border-color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#42516a}
.thumb{height:230px;background:#202b3d;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}.initial{font-size:62px;font-weight:900;color:#6b7890}
.cardbody{padding:14px}.ar{font-size:19px;font-weight:800}.en{font-size:12px;color:var(--muted);margin-top:3px}.tag{display:inline-block;margin-top:10px;padding:5px 8px;border-radius:7px;background:#1e293b;color:#cbd5e1;font-size:11px}
#profile{display:none}.back{display:inline-block;margin-bottom:18px;color:var(--gold);cursor:pointer}
.profile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.profileTop{display:grid;grid-template-columns:260px 1fr;gap:22px}.profileImg{height:340px;background:#202b3d;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center}.profileImg img{width:100%;height:100%;object-fit:cover}
h1{margin:0 0 5px;font-size:32px}.en2{color:var(--muted);margin-bottom:18px}.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.box{background:var(--card2);padding:13px;border-radius:12px}.label{font-size:11px;color:var(--muted);margin-bottom:4px}.value{font-weight:700}
section{margin-top:22px}.episode{display:inline-block;background:#0d1421;border:1px solid var(--line);padding:9px 12px;border-radius:10px;margin:4px}
.notice{padding:13px;background:#1a1520;border:1px solid #4a3037;border-radius:12px;color:#ddd;margin-top:18px}
footer{color:#778399;text-align:center;padding:35px 0;font-size:12px}
@media(max-width:650px){.profileTop{grid-template-columns:1fr}.profileImg{height:280px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.thumb{height:180px}.ar{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="logo">CONAN <span>FILES</span></div>
<div class="sub">موسوعة غير رسمية لعالم المحقق كونان</div>
</header>

<main id="home">
<input id="search" class="search" placeholder="ابحث عن شخصية...">
<div id="filters" class="filters"></div>
<section>
<div id="grid" class="grid"></div>
</section>
</main>

<main id="profile">
<div class="back" onclick="goHome()">← العودة إلى الشخصيات</div>
<div id="profileContent"></div>
</main>

<footer>Fan project — Detective Conan / Case Closed. جميع الحقوق الخاصة بالشخصيات والصور لأصحابها.</footer>
</div>
<script>
const chars = [{"slug": "conan", "name_ar": "كونان إيدوغاوا", "name_en": "Conan Edogawa", "bio": "بطل السلسلة؛ هويته الحقيقية شينيتشي كودو.", "group": "Detective Boys", "related": "Shinichi Kudo", "episodes": ["1", "2", "129", "345", "425"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Conan_Edogawa_Profile.jpg"}, {"slug": "shinichi", "name_ar": "شينيتشي كودو", "name_en": "Shinichi Kudo", "bio": "محقق ثانوية تقلص جسده بعد إجباره على تناول عقار المنظمة السوداء.", "group": "Kudo Family", "related": "Ran Mouri", "episodes": ["1", "48–49", "190–193", "521–523", "927–928"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Shinichi_Kudo_Profile.jpg"}, {"slug": "ran", "name_ar": "ران موري", "name_en": "Ran Mouri", "bio": "صديقة شينيتشي المقربة وابنة كوغورو وإيري.", "group": "Mouri Family", "related": "Shinichi Kudo", "episodes": ["1", "48–49", "188–193", "616–621"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Ran_Mouri_Profile.jpg"}, {"slug": "kogoro", "name_ar": "كوغورو موري", "name_en": "Kogoro Mouri", "bio": "محقق خاص ووالد ران؛ ارتبط اسمه بلقب كوغورو النائم.", "group": "Mouri Family", "related": "Ran Mouri", "episodes": ["2", "96–97", "217", "333–336"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Kogoro_Mouri_Profile.jpg"}, {"slug": "haibara", "name_ar": "آي هايبارا", "name_en": "Ai Haibara", "bio": "عالمة سابقة في المنظمة السوداء؛ هويتها الحقيقية شيهو ميانو.", "group": "Detective Boys", "related": "Conan Edogawa", "episodes": ["129", "176–178", "345", "701–704", "1077–1080"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Haibara_Ai_Profile.jpg"}, {"slug": "agasa", "name_ar": "هيروشي أغاسا", "name_en": "Hiroshi Agasa", "bio": "مخترع وصديق مقرّب من شينيتشي، يساعد كونان بأدواته.", "group": "Allies", "related": "Conan Edogawa", "episodes": ["1", "129", "309–311", "486–487"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Hiroshi_Agasa_Profile.jpg"}, {"slug": "ayumi", "name_ar": "أيومي يوشيدا", "name_en": "Ayumi Yoshida", "bio": "عضوة في فريق المتحرين الصغار.", "group": "Detective Boys", "related": "Conan Edogawa", "episodes": ["1", "12", "33", "140"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Ayumi_Yoshida_Profile.jpg"}, {"slug": "genta", "name_ar": "غينتا كوجيما", "name_en": "Genta Kojima", "bio": "عضو في فريق المتحرين الصغار.", "group": "Detective Boys", "related": "Ayumi Yoshida", "episodes": ["1", "12", "33"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Genta_Kojima_Profile.jpg"}, {"slug": "mitsuhiko", "name_ar": "ميتسوهيكو تسوبورايا", "name_en": "Mitsuhiko Tsuburaya", "bio": "عضو ذكي في فريق المتحرين الصغار.", "group": "Detective Boys", "related": "Ayumi Yoshida", "episodes": ["1", "33", "136–137", "140"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Mitsuhiko_Tsuburaya_Profile.jpg"}, {"slug": "sonoko", "name_ar": "سونوكو سوزوكي", "name_en": "Sonoko Suzuki", "bio": "صديقة ران المقربة من عائلة سوزوكي الثرية.", "group": "Suzuki Family", "related": "Ran Mouri", "episodes": ["6", "34–35", "219", "490"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Sonoko_Suzuki_Profile.jpg"}, {"slug": "heiji", "name_ar": "هيجي هاتوري", "name_en": "Heiji Hattori", "bio": "محقق من أوساكا ومنافس وصديق شينيتشي.", "group": "Osaka Police / Allies", "related": "Kazuha Toyama", "episodes": ["48–49", "57–58", "118", "490", "1029–1030"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Heiji_Hattori_Profile.jpg"}, {"slug": "kazuha", "name_ar": "كازوها توياما", "name_en": "Kazuha Toyama", "bio": "صديقة طفولة هيجي ومقربة منه.", "group": "Osaka", "related": "Heiji Hattori", "episodes": ["118", "141–143", "166–168", "1029–1030"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Kazuha_Toyama_Profile.jpg"}, {"slug": "akai", "name_ar": "شوويتشي أكاي", "name_en": "Shuichi Akai", "bio": "عميل FBI ومتخصص في مواجهة المنظمة السوداء.", "group": "FBI", "related": "Jodie Starling", "episodes": ["230–231", "345", "491–504", "779–783", "861–864"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Shuichi_Akai_Profile.jpg"}, {"slug": "amuro", "name_ar": "تورو أمورو", "name_en": "Toru Amuro", "bio": "اسم مستعار لري فورويا، وهو عميل في الشرطة السرية اليابانية ومتخفٍ داخل المنظمة.", "group": "Public Security / Organization", "related": "Conan Edogawa", "episodes": ["667–668", "700", "701–704", "770–783", "898–902"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Toru_Amuro_Profile.jpg"}, {"slug": "furuya", "name_ar": "ري فورويا", "name_en": "Rei Furuya", "bio": "عميل في الأمن العام الياباني يستخدم هوية تورو أمورو.", "group": "Public Security", "related": "Toru Amuro", "episodes": ["779–783", "866–867", "1029–1030"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Rei_Furuya_Profile.jpg"}, {"slug": "gin", "name_ar": "جين", "name_en": "Gin", "bio": "عضو بارز في المنظمة السوداء وأحد أخطر خصوم كونان.", "group": "Black Organization", "related": "Vodka", "episodes": ["1", "13", "176–178", "345", "425"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Gin_Profile.jpg"}, {"slug": "vodka", "name_ar": "فودكا", "name_en": "Vodka", "bio": "عضو في المنظمة السوداء وشريك جين.", "group": "Black Organization", "related": "Gin", "episodes": ["1", "176–178", "345", "425"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Vodka_Profile.jpg"}, {"slug": "vermouth", "name_ar": "فيرموث", "name_en": "Vermouth", "bio": "عضوة غامضة وبارعة في التنكر داخل المنظمة السوداء.", "group": "Black Organization", "related": "Conan Edogawa", "episodes": ["176–178", "286–288", "345", "425"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Vermouth_Profile.jpg"}, {"slug": "kaito", "name_ar": "كايتو كيد", "name_en": "Kaito Kid", "bio": "لص محترف يستخدم الخدع والتخفي ويظهر في قضايا عديدة.", "group": "Kaito Kid", "related": "Conan Edogawa", "episodes": ["76", "219", "356", "887–888"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Kaito_Kid_Profile.jpg"}, {"slug": "sato", "name_ar": "ميواكو ساتو", "name_en": "Miwako Sato", "bio": "ضابطة في شرطة العاصمة اليابانية.", "group": "Tokyo Metropolitan Police", "related": "Wataru Takagi", "episodes": ["130–131", "146–147", "304", "535–536"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Miwako_Sato_Profile.jpg"}, {"slug": "takagi", "name_ar": "واتارو تاكاغي", "name_en": "Wataru Takagi", "bio": "ضابط في شرطة العاصمة اليابانية.", "group": "Tokyo Metropolitan Police", "related": "Miwako Sato", "episodes": ["146–147", "156–157", "304", "535–536"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Wataru_Takagi_Profile.jpg"}, {"slug": "shiratori", "name_ar": "ناتسومي شيراتوري", "name_en": "Ninzaburo Shiratori", "bio": "مفتش في شرطة العاصمة اليابانية.", "group": "Tokyo Metropolitan Police", "related": "Miwako Sato", "episodes": ["146–147", "304", "568–569"], "image": "https://www.detectiveconanworld.com/wiki/Special:Redirect/file/Ninzaburo_Shiratori_Profile.jpg"}];
const imgFallback = n => `<div class="initial">${(n||'?').slice(0,1)}</div>`;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function card(c){
 return `<a class="card" href="#${c.slug}" onclick="openChar('${c.slug}');return false">
 <div class="thumb"><img src="${c.image}" alt="${esc(c.name_en)}" onerror="this.style.display='none';this.parentNode.innerHTML=imgFallback('${esc(c.name_ar)}')"></div>
 <div class="cardbody"><div class="ar">${esc(c.name_ar)}</div><div class="en">${esc(c.name_en)}</div><span class="tag">${esc(c.group)}</span></div></a>`;
}
let active='الكل';
function render(){
 const q=document.getElementById('search').value.trim().toLowerCase();
 const list=chars.filter(c=>(active==='الكل'||c.group===active)&&(!q||c.name_ar.toLowerCase().includes(q)||c.name_en.toLowerCase().includes(q)));
 document.getElementById('grid').innerHTML=list.map(card).join('')||'<p>لا توجد نتائج.</p>';
}
function filters(){
 const groups=['الكل',...new Set(chars.map(c=>c.group))];
 document.getElementById('filters').innerHTML=groups.map(g=>`<button class="filter ${g===active?'active':''}" onclick="active='${g.replace(/'/g,"\\'")}';filters();render()">${esc(g)}</button>`).join('');
}
function openChar(slug){
 const c=chars.find(x=>x.slug===slug); if(!c)return;
 document.getElementById('home').style.display='none';document.getElementById('profile').style.display='block';
 document.getElementById('profileContent').innerHTML=`
 <div class="profile"><div class="profileTop">
 <div class="profileImg"><img src="${c.image}" alt="${esc(c.name_en)}" onerror="this.style.display='none';this.parentNode.innerHTML=imgFallback('${esc(c.name_ar)}')"></div>
 <div><h1>${esc(c.name_ar)}</h1><div class="en2">${esc(c.name_en)}</div>
 <div class="info"><div class="box"><div class="label">الدور</div><div class="value">${esc(c.bio)}</div></div>
 <div class="box"><div class="label">المجموعة</div><div class="value">${esc(c.group)}</div></div>
 <div class="box"><div class="label">شخصية مرتبطة</div><div class="value">${esc(c.related)}</div></div></div>
 </div></div>
 <section><h2>أبرز الحلقات</h2>${c.episodes.map(e=>`<span class="episode">الحلقة ${esc(e)}</span>`).join('')}</section>
 <div class="notice">ملاحظة: أرقام الحلقات هنا قائمة مختصرة لأبرز الظهورات وليست سجلًا كاملًا لكل ظهور.</div>
 </div>`;
 location.hash=slug; window.scrollTo(0,0);
}
function goHome(){location.hash='';document.getElementById('profile').style.display='none';document.getElementById('home').style.display='block';render()}
document.getElementById('search').addEventListener('input',render);
function route(){const s=location.hash.slice(1); if(s&&chars.some(c=>c.slug===s))openChar(s);else goHome()}
filters();render();route();
</script>
</body>
</html>
